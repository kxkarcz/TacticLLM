[project]
name = "tacticllm"
version = "0.1.0"
description = "Analiza taktyczna meczów padla z wideo (YouTube) + raport dla trenera generowany przez LLM (Agno)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Wideo + computer vision (uruchamiane na komputerze z GPU NVIDIA).
# PyTorch z CUDA instaluj osobno – patrz README.
vision = [
    "yt-dlp>=2025.1.1",
    "opencv-python>=4.9",
    "ultralytics>=8.3",
    "matplotlib>=3.8",
]
# Adnotacje punktów: lokalnie przez Ollamę (darmowe) albo Gemini (API).
annotate = ["ollama>=0.5", "google-genai>=1.20"]
# Raport i czat z agentem.
llm = ["agno>=2.0", "anthropic>=0.40", "ollama>=0.5"]
dev = ["pytest>=8.0"]
all = ["tacticllm[vision,annotate,llm]"]

[project.scripts]
tacticllm = "tacticllm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacticllm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
